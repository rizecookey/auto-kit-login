<!DOCTYPE html>

<html data-bs-theme="dark">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Configuration</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="../common_style.css" />
    <script src="popup.js" defer></script>
  </head>

  <body>
    <div class="user_config">
      <h1>Configuration</h1>
      <div class="container">
        <div class="row flex-nowrap">
          <div class="col-10 name">Enable autologin</div>
          <div class="col toggle form-check form-switch">
            <input
              type="checkbox"
              role="switch"
              class="form-check-input"
              id="enable_autologin"
            />
          </div>
        </div>
        <br />
        <div class="row flex-nowrap">
          <u>Enable autologin for:</u>
        </div>
      </div>
      <span id="page_config" class="container ps-4"></span>
    </div>
  </body>
</html>

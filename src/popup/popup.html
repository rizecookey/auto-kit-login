<!DOCTYPE html>

<html data-bs-theme="dark">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Configuration</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="../common_style.css" />
    <script src="popup.js" defer></script>
  </head>

  <body>
    <div class="user_config">
      <h1>Configuration</h1>
      <div class="container">
        <div
          class="row flex-nowrap align-items-center"
          title="Enable automatic login redirection"
        >
          <div class="col-10 name">Enable autologin</div>
          <div class="col option toggle form-check form-switch">
            <input
              type="checkbox"
              role="switch"
              class="form-check-input float-end"
              id="enable_autologin"
            />
          </div>
        </div>
        <div
          class="row flex-nowrap align-items-center"
          title="Delay session cookie expiration"
        >
          <div class="col-10 name">Delay session cookie expiration</div>
          <div class="col option toggle form-check form-switch">
            <input
              type="checkbox"
              role="switch"
              class="form-check-input float-end"
              id="enable_session_cookie_extension"
            />
          </div>
        </div>
        <div
          class="row flex-nowrap align-items-center"
          title="Enable auto submitting the login form on password paste"
        >
          <div class="col-10 name">Auto submit form</div>
          <div class="col toggle form-check form-switch">
            <input
              type="checkbox"
              role="switch"
              class="form-check-input float-end"
              id="enable_auto_submit"
            />
          </div>
        </div>
        <div
          class="row flex-nowrap align-items-center"
          title="Select the type of login window to be opened automatically"
        >
          <div class="col-7 name">Login window type</div>
          <div class="col">
            <div class="dropdown float-end" id="login_window_type">
              <button
                class="btn btn-secondary dropdown-toggle"
                type="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Unknown
              </button>
              <ul class="dropdown-menu" id="login_window_type_options"></ul>
            </div>
          </div>
        </div>
        <br />
        <div class="row flex-nowrap">
          <u>Enable autologin for:</u>
        </div>
      </div>
      <span id="page_config" class="container ps-4"></span>
    </div>
  </body>
</html>
